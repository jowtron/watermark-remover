[package]
name = "watermark-remover"
version = "0.2.0"
edition = "2021"
description = "Clean-room desktop watermark remover (Gemini ✦) — alpha-unblend, pure Rust"

[[bin]]
name = "watermark-remover"
path = "src/main.rs"

[dependencies]
iced = { version = "0.13", features = ["image"] }
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "tiff"] }
serde_json = "1"
dirs = "5"

[profile.release]
opt-level = 3
lto = "thin"
